previews:
  generation: manual

services:
  - type: web
    name: agentforge-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 120
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: openai
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSION
        value: "1536"
      - key: RATE_LIMIT_BACKEND
        value: redis
      - key: FORWARDED_ALLOW_IPS
        value: "127.0.0.1"
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: agentforge-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: agentforge-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: REDIS_URL
        sync: false

  - type: web
    name: agentforge-web
    runtime: static
    region: singapore
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: agentforge-api
          envVarKey: RENDER_EXTERNAL_URL
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()

databases:
  - name: agentforge-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: agentforge
    user: agentforge
