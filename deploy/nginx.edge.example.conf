# Reference edge config. Replace domains, TLS paths and upstreams before use.
# Only this trusted proxy may reach the backend; backend forwarded-allow-ips
# must identify the proxy's network address (never '*').
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ai:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=streams:10m;

upstream agentforge_api { server backend:8000; }
upstream agentforge_ui { server frontend:8080; }

server {
    listen 443 ssl;
    server_name app.example.invalid;
    ssl_certificate /etc/tls/fullchain.pem;
    ssl_certificate_key /etc/tls/privkey.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;

    location = /health {
        proxy_pass http://agentforge_api;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location = /ready {
        proxy_pass http://agentforge_api;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/auth/(login|register)$ {
        client_max_body_size 32k;
        limit_req zone=auth burst=5 nodelay;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_pass http://agentforge_api;
    }

    location = /agent/chat/stream {
        client_max_body_size 64k;
        limit_req zone=ai burst=5 nodelay;
        limit_conn streams 2;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
        proxy_pass http://agentforge_api;
    }

    location ~ ^/(agent|me|chat|conversations)(/|$) {
        client_max_body_size 64k;
        limit_req zone=ai burst=5 nodelay;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_pass http://agentforge_api;
    }

    location ~ ^/documents/me(/|$) {
        client_max_body_size 11m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_pass http://agentforge_api;
    }

    location ~ ^/documents(/|$) {
        client_max_body_size 11m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_pass http://agentforge_api;
    }

    location / {
        proxy_pass http://agentforge_ui;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
