[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-backend"
version = "0.1.0"
description = "AgentForge FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.2",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "pgvector==0.3.6",
  "python-multipart==0.0.32",
  "pypdf==5.1.0",
  "openai==1.52.2",
  "redis==5.2.1",
  "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.27.2", "fpdf2==2.8.9"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
